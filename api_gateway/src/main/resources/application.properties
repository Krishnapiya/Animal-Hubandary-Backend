spring.application.name=api_gateway

server.port=8083

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost


spring.config.import=optional:configserver:http://localhost:8088

spring.cloud.gateway.routes[0].id=admin-service
spring.cloud.gateway.routes[0].uri=lb://admin-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/admin/**

spring.cloud.gateway.routes[1].id=springSecurity
spring.cloud.gateway.routes[1].uri=lb://springSecurity
spring.cloud.gateway.routes[1].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[2].id=storeManagement
spring.cloud.gateway.routes[2].uri=lb://storeManagement
spring.cloud.gateway.routes[2].predicates[0]=Path=/store/**

spring.cloud.gateway.routes[3].id=assetManagement
spring.cloud.gateway.routes[3].uri=lb://assetManagement
spring.cloud.gateway.routes[3].predicates[0]=Path=/asset/**

spring.cloud.gateway.routes[4].id=petshop-service
spring.cloud.gateway.routes[4].uri=lb://petshop-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/petshop/**
# Routes are defined in GatewayRoutesConfig (RouteLocator bean) so /api/admin/** is always registered.

# CORS Configuration
# Allowed origins (comma-separated). Use * for all origins in development
cors.allowed-origins=*
# Allowed methods (comma-separated)
cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD
# Allowed headers (comma-separated). Use * for all headers
cors.allowed-headers=*
# Allow credentials
cors.allow-credentials=true
# Max age for preflight requests (in seconds)
cors.max-age=3600