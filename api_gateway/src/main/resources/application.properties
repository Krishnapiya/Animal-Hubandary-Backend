spring.application.name=api_gateway

server.port=8083

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost


spring.config.import=optional:configserver:http://localhost:8088


# Routes are defined in GatewayRoutesConfig (RouteLocator bean) so /api/admin/** is always registered.

# CORS Configuration
# Allowed origins (comma-separated). Use * for all origins in development
cors.allowed-origins=*
# Allowed methods (comma-separated)
cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD
# Allowed headers (comma-separated). Use * for all headers
cors.allowed-headers=*
# Allow credentials
cors.allow-credentials=true
# Max age for preflight requests (in seconds)
cors.max-age=3600